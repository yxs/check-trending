name: Daily Data Refresh

on:
  schedule:
    # 03:00 Beijing (UTC+8) every day → 19:00 UTC the previous day
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Crawl end date (YYYY-MM-DD), defaults to today UTC"
        required: false

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xvfb + patchright + stealth chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright
          patchright install chromium --no-shell --with-deps
          which google-chrome-stable || true
          google-chrome-stable --version 2>/dev/null || true

      - name: Resolve crawl parameters
        run: |
          END_DATE="${{ github.event.inputs.end_date }}"
          if [ -z "$END_DATE" ]; then
            END_DATE="$(date -u +%F)"
          fi
          echo "END_DATE=$END_DATE" >> "$GITHUB_ENV"
          echo "Resolved daily refresh end_date=$END_DATE"

      - name: Refresh dataset (current month + buffer)
        run: |
          xvfb-run -a python -m check_trending.checkee_scraper \
            --mode daily \
            --start-date 2025-07-01 \
            --end-date "$END_DATE" \
            --monthly-fetcher browser \
            --delay-seconds 0.3 \
            --jitter-seconds 0.2 \
            --retries 2 \
            --timeout 30

      - name: Build web data payload
        run: python scripts/build_web_data.py

      - name: Run scraper unit tests
        run: python -m unittest tests/test_checkee_scraper.py

      - name: Commit and push updated data
        run: |
          if [ -z "$(git status --porcelain data/checkee public/data/app-data.json)" ]; then
            echo "No dataset changes detected."
            exit 0
          fi
          git add data/checkee public/data/app-data.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Checkee data for $END_DATE"
          git push
