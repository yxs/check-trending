name: Daily Data Refresh

on:
  schedule:
    # 02:37 Beijing (UTC+8) on Tue / Thu / Sat → 18:37 UTC the previous day.
    # Off-hour minute avoids GitHub Actions' top-of-hour scheduling spike.
    # 3 runs/week aligns with upstream activity (Sat/Sun on checkee.info are
    # < 1% activity; Mon-Fri are 16-23% each). Each run handles one Pending
    # bucket — every Pending case is refreshed exactly once per week.
    #   Tue run → bucket 0 (case_number % 3 == 0)
    #   Thu run → bucket 1 (case_number % 3 == 1)
    #   Sat run → bucket 2 (case_number % 3 == 2)
    - cron: "37 18 * * 1,3,5"
  workflow_dispatch:
    inputs:
      bucket:
        description: "Pending bucket: auto / 0 / 1 / 2"
        required: false
        default: "auto"
      probe_count:
        description: "Frontier probe size above max_known case_number"
        required: false
        default: "80"
      end_date:
        description: "End date (YYYY-MM-DD), defaults to today UTC"
        required: false

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve parameters
        id: params
        run: |
          END_DATE="${{ github.event.inputs.end_date }}"
          BUCKET="${{ github.event.inputs.bucket }}"
          PROBE_COUNT="${{ github.event.inputs.probe_count }}"
          [ -z "$END_DATE" ] && END_DATE="$(date -u +%F)"
          [ -z "$BUCKET" ] && BUCKET="auto"
          [ -z "$PROBE_COUNT" ] && PROBE_COUNT="80"
          echo "END_DATE=$END_DATE" >> "$GITHUB_ENV"
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "PROBE_COUNT=$PROBE_COUNT" >> "$GITHUB_ENV"
          echo "Resolved: end_date=$END_DATE bucket=$BUCKET probe_count=$PROBE_COUNT"

      - name: Skip if data is fresh (< 36h)
        id: freshness_gate
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          summary = Path("data/checkee/crawl_summary.json")
          if not summary.exists():
              print("no prior summary; running")
              sys.exit(0)
          payload = json.loads(summary.read_text())
          generated_at = payload.get("generated_at", "")
          if not generated_at:
              print("summary missing generated_at; running")
              sys.exit(0)
          # New writes are tz-aware UTC; legacy writes were naive (also UTC,
          # since CI ran in UTC). Treat naive as UTC.
          last = datetime.fromisoformat(generated_at)
          if last.tzinfo is None:
              last = last.replace(tzinfo=timezone.utc)
          now = datetime.now(tz=timezone.utc)
          age_h = (now - last).total_seconds() / 3600
          if age_h < 36 and os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              print(f"data is {age_h:.1f}h old (< 36h); skipping scheduled run")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("skip=true\n")
          else:
              print(f"data is {age_h:.1f}h old; proceeding")
          PY

      - name: Random entry delay (0-30 min)
        if: steps.freshness_gate.outputs.skip != 'true'
        run: |
          # Decorrelates from the cron minute so upstream sees jittered timing.
          DELAY=$((RANDOM % 1801))
          echo "sleeping ${DELAY}s before scrape (decorrelating from cron)"
          sleep "$DELAY"

      - name: Daily refresh (Path 1)
        if: steps.freshness_gate.outputs.skip != 'true'
        run: |
          python -m check_trending.checkee_scraper daily \
            --start-date 2025-07-01 \
            --end-date "$END_DATE" \
            --bucket "$BUCKET" \
            --probe-count "$PROBE_COUNT" \
            --fetch-budget 1000 \
            --delay-seconds 3 \
            --jitter-seconds 4 \
            --retries 1 \
            --timeout 30 \
            --max-failure-rate 0.20

      - name: Build web data payload
        if: steps.freshness_gate.outputs.skip != 'true'
        run: python scripts/build_web_data.py

      - name: Run scraper unit tests
        if: steps.freshness_gate.outputs.skip != 'true'
        run: python -m unittest tests/test_checkee_scraper.py

      - name: Surface run stats to step summary
        if: steps.freshness_gate.outputs.skip != 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("data/checkee/last_run_summary.json")
          if not path.exists():
              print("## Daily refresh\n\nNo run summary written.")
              raise SystemExit(0)
          d = json.loads(path.read_text())
          print("## Daily refresh\n")
          print(f"- bucket: `{d.get('bucket')}`")
          print(f"- attempts: **{d.get('attempts', 0)}**")
          print(f"- successes: {d.get('successes', 0)}")
          print(f"- failures: {d.get('failures', 0)} ({d.get('failure_rate_pct', 0)}%)")
          print(f"- new cases discovered: **{d.get('new_cases_discovered', 0)}**")
          print(f"- pending refreshed: {d.get('pending_refreshed', 0)}")
          print(f"- pending status changed: **{d.get('pending_status_changed', 0)}**")
          PY

      - name: Commit and push if data changed
        if: steps.freshness_gate.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain data/checkee public/data/app-data.json)" ]; then
            echo "No dataset changes detected."
            exit 0
          fi
          git add data/checkee public/data/app-data.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Daily refresh: $END_DATE (bucket=$BUCKET)"
          git push
