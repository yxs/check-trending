name: Daily Data Refresh

on:
  schedule:
    # 02:37 Beijing (UTC+8) every day → 18:37 UTC the previous day.
    # Off-hour minute to avoid GitHub Actions' top-of-hour scheduling spike,
    # which delays or drops schedule events on free public repos.
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Crawl end date (YYYY-MM-DD), defaults to today UTC"
        required: false
      probe_count:
        description: "How many case numbers above current max to probe (default: 40)"
        required: false

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve crawl parameters
        run: |
          END_DATE="${{ github.event.inputs.end_date }}"
          PROBE_COUNT="${{ github.event.inputs.probe_count }}"
          if [ -z "$END_DATE" ]; then
            END_DATE="$(date -u +%F)"
          fi
          if [ -z "$PROBE_COUNT" ]; then
            PROBE_COUNT="40"
          fi
          MAX_KNOWN_CASE="$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/checkee/checkee_cases.json")
          records = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          case_numbers = [
              int(str(r.get("case_number", "0")))
              for r in records
              if str(r.get("case_number", "")).isdigit()
          ]
          print(max(case_numbers) if case_numbers else 845700)
          PY
          )"
          CASE_NUMBER_START="842700"
          CASE_NUMBER_END="$((MAX_KNOWN_CASE + PROBE_COUNT))"
          echo "END_DATE=$END_DATE" >> "$GITHUB_ENV"
          echo "CASE_NUMBER_START=$CASE_NUMBER_START" >> "$GITHUB_ENV"
          echo "CASE_NUMBER_END=$CASE_NUMBER_END" >> "$GITHUB_ENV"
          echo "Resolved range: $CASE_NUMBER_START..$CASE_NUMBER_END (max_known=$MAX_KNOWN_CASE, probe=$PROBE_COUNT)"

      - name: Refresh dataset (detail-range mode)
        run: |
          python -m check_trending.checkee_scraper \
            --source detail-range \
            --start-date 2025-07-01 \
            --end-date "$END_DATE" \
            --case-number-start "$CASE_NUMBER_START" \
            --case-number-end "$CASE_NUMBER_END" \
            --delay-seconds 0.3 \
            --jitter-seconds 0.2 \
            --retries 2 \
            --timeout 30

      - name: Build web data payload
        run: python scripts/build_web_data.py

      - name: Run scraper unit tests
        run: python -m unittest tests/test_checkee_scraper.py

      - name: Commit and push updated data
        run: |
          if [ -z "$(git status --porcelain data/checkee public/data/app-data.json)" ]; then
            echo "No dataset changes detected."
            exit 0
          fi
          git add data/checkee public/data/app-data.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Checkee data for $END_DATE"
          git push
